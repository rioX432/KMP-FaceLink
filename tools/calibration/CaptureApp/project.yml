name: CaptureApp
options:
  bundleIdPrefix: io.github.kmpfacelink.tools
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

targets:
  CaptureApp:
    type: application
    platform: iOS
    sources:
      - path: CaptureApp
    settings:
      base:
        SWIFT_VERSION: "5.9"
        # ARFaceTrackingConfiguration supports Apple Neural Engine devices on
        # iOS/iPadOS 14+. Keep the runtime isSupported guard as the authority.
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: CaptureApp/Info.plist
      properties:
        NSCameraUsageDescription: "Camera access is required for ARKit face tracking and RGB frame capture."
        UIRequiredDeviceCapabilities:
          - arkit
          - iphone-ipad-minimum-performance-a12
        # The RGB encoder below normalizes ARKit's camera buffer for portrait.
        # Lock the measurement UI so rotations cannot silently change that contract.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UILaunchScreen: {}
