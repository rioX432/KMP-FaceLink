name: Publish to GitHub Packages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to publish (e.g. 0.2.0). Leave empty to auto-resolve: tag push = release version, otherwise -SNAPSHOT."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-github-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'

jobs:
  publish:
    name: Publish to GitHub Packages
    # self-hosted macOS ARM64 is required: kmp-facelink-voice has iOS whisper.cpp
    # cinterop, so publishing the iOS klib publications needs macOS + the whisper
    # setup script and the Kotlin/Native toolchain. ~/.konan persists on the
    # self-hosted runner between jobs, so no actions/cache step is needed.
    runs-on: [ self-hosted, macOS, ARM64 ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup whisper.cpp for iOS
        run: ./scripts/setup-whisper-ios.sh

      - name: Resolve publish version
        id: ver
        # Priority: explicit workflow_dispatch input > tag (release version) >
        # otherwise a mutable -SNAPSHOT, so repeated master pushes never collide.
        run: |
          BASE=$(grep '^VERSION_NAME=' gradle.properties | cut -d '=' -f2 | tr -d '[:space:]')
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="$BASE"
          else
            VERSION="${BASE}-SNAPSHOT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Publish to GitHub Packages
        run: >-
          ./gradlew publishAllPublicationsToGitHubPackagesRepository
          -PVERSION_NAME=${{ steps.ver.outputs.version }}
          --no-daemon --stacktrace
        env:
          # GITHUB_TOKEN must be injected explicitly — it is not exported to the
          # process environment by default. GITHUB_ACTOR is the publishing username.
          # GPG_* is intentionally omitted: GitHub Packages requires no signature,
          # and the Sign tasks are guarded off on the GitHubPackages publish path.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
