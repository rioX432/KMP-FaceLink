name: Deploy Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; let in-progress runs finish so a
# deployment is never left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'

jobs:
  deploy-docs:
    name: Deploy Dokka Docs
    runs-on: [ self-hosted, macOS, ARM64 ]
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup whisper.cpp for iOS
        run: ./scripts/setup-whisper-ios.sh

      - name: Generate Dokka HTML
        run: ./gradlew dokkaGenerate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
