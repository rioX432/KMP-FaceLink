name: Publish to GitHub Packages

# On every master merge this publishes all KMP modules to GitHub Packages with a
# unique timestamp version (0.<minor>.<UTC YYYYMMDDHHMM>), builds the iOS
# XCFrameworks, and creates a matching GitHub Release with updated Package.swift
# checksums. GitHub Packages is the sole Maven channel; SPM (Package.swift) is the
# sole iOS channel. Maven Central / Gradle Plugin Portal publishing was removed.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to publish (e.g. 0.3.0). Leave empty to auto-resolve 0.<minor>.<UTC timestamp>."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-github-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'

jobs:
  resolve-version:
    name: Resolve version
    runs-on: [ self-hosted, macOS, ARM64 ]
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve publish version
        id: ver
        # Priority: explicit workflow_dispatch input > auto timestamp version.
        # The timestamp version takes MAJOR.MINOR from VERSION_NAME and replaces
        # the patch with a UTC YYYYMMDDHHMM stamp, so every master merge yields a
        # unique, immutable release version (no -SNAPSHOT, no 409 conflicts).
        run: |
          BASE_MM=$(grep '^VERSION_NAME=' gradle.properties | cut -d '=' -f2 | tr -d '[:space:]' | sed -E 's/\.[0-9]+$//')
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          else
            TS=$(date -u +"%Y%m%d%H%M")
            VERSION="${BASE_MM}.${TS}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag v$VERSION)"

  publish-packages:
    name: Publish Maven packages
    needs: resolve-version
    # self-hosted macOS ARM64 is required: kmp-facelink-voice has iOS whisper.cpp
    # cinterop, so publishing the iOS klib publications needs macOS + the whisper
    # setup script and the Kotlin/Native toolchain.
    runs-on: [ self-hosted, macOS, ARM64 ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup whisper.cpp for iOS
        run: ./scripts/setup-whisper-ios.sh

      - name: Setup pinned OpenSeeFace models for JVM publication
        run: ./scripts/setup-openseeface-models.sh

      - name: Publish to GitHub Packages
        run: >-
          ./gradlew publishAllPublicationsToGitHubPackagesRepository
          -PVERSION_NAME=${{ needs.resolve-version.outputs.version }}
          --no-daemon --stacktrace
        env:
          # GITHUB_TOKEN must be injected explicitly — it is not exported to the
          # process environment by default. GITHUB_ACTOR is the publishing username.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-xcframeworks:
    name: Build XCFrameworks
    needs: resolve-version
    runs-on: [ self-hosted, macOS, ARM64 ]
    timeout-minutes: 60
    strategy:
      matrix:
        module:
          - name: kmp-facelink
            framework: KMPFaceLink
          - name: kmp-facelink-avatar
            framework: KMPFaceLinkAvatar
          - name: kmp-facelink-actions
            framework: KMPFaceLinkActions
          - name: kmp-facelink-voice
            framework: KMPFaceLinkVoice
          - name: kmp-facelink-llm
            framework: KMPFaceLinkLlm
          - name: kmp-facelink-pipeline
            framework: KMPFaceLinkPipeline
          - name: kmp-facelink-networking
            framework: KMPFaceLinkNetworking
          - name: kmp-facelink-vmc
            framework: KMPFaceLinkVMC
          - name: kmp-facelink-ifm
            framework: KMPFaceLinkIFM
          - name: kmp-facelink-interact
            framework: KMPFaceLinkInteract
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Always run: kmp-facelink-pipeline (and any module depending on
      # kmp-facelink-voice) compiles voice's iosMain, which needs the whisper.cpp
      # cinterop. Restricting this to the voice module breaks dependents.
      - name: Setup whisper.cpp for iOS
        run: ./scripts/setup-whisper-ios.sh

      - name: Build XCFramework
        run: ./gradlew :${{ matrix.module.name }}:assemble${{ matrix.module.framework }}XCFramework

      - name: Package XCFramework
        run: |
          cd ${{ matrix.module.name }}/build/XCFrameworks/release
          zip -r ${{ matrix.module.framework }}.xcframework.zip ${{ matrix.module.framework }}.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module.framework }}-xcframework
          path: ${{ matrix.module.name }}/build/XCFrameworks/release/${{ matrix.module.framework }}.xcframework.zip

  create-release:
    name: Create GitHub Release
    needs: [resolve-version, publish-packages, build-xcframeworks]
    runs-on: [ self-hosted, macOS, ARM64 ]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve-version.outputs.tag }}
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      # Check out master with full history so we can commit Package.swift and move
      # the tag. With the single self-hosted runner + serialized concurrency,
      # master HEAD equals the built commit in the normal flow.
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-xcframework'

      - name: Collect XCFramework zips
        run: |
          mkdir -p release-assets
          find artifacts -name '*.xcframework.zip' -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create release
        run: |
          gh release create "$TAG" \
            --target master \
            --title "$TAG" \
            --generate-notes \
            release-assets/*.xcframework.zip

      # KMP-FaceLink is a PRIVATE repo, so SwiftPM binary targets must use the
      # GitHub REST API asset URLs (not public download URLs). Regenerate
      # Package.swift from the release assets just created.
      - name: Generate Package.swift from release assets
        run: |
          gh api "/repos/$REPO/releases/tags/$TAG" > release.json
          python3 scripts/generate-package-swift.py Package.swift "$VERSION" release.json release-assets

      # Commit the manifest to master ([skip ci] so it does not re-trigger this
      # workflow), then force-move the tag onto that commit so SwiftPM consumers
      # resolving the tag read the regenerated Package.swift.
      - name: Commit Package.swift and move tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "Update Package.swift for $TAG [skip ci]"
          git push origin HEAD:master
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
