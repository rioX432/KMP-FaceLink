version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      androidx:
        patterns:
          - "androidx.*"
      camerax:
        patterns:
          - "androidx.camera*"
      compose:
        patterns:
          - "androidx.compose*"
          - "androidx.activity:activity-compose"
      ktor:
        patterns:
          - "io.ktor*"
      detekt:
        patterns:
          - "io.gitlab.arturbosch.detekt*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
