name: Deploy Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

# GitHub Pages is disabled at the organization level for this repository, so the
# Dokka HTML is published as a build artifact instead of being deployed to Pages.
# When an org owner enables Pages (Settings -> Pages -> Source: GitHub Actions),
# switch the final step back to actions/upload-pages-artifact + actions/deploy-pages
# and restore the `pages`/`id-token` permissions and the `github-pages` environment.
permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'

jobs:
  deploy-docs:
    name: Generate Dokka Docs
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup whisper.cpp for iOS
        run: ./scripts/setup-whisper-ios.sh

      - name: Generate Dokka HTML
        run: ./gradlew dokkaGenerate

      - name: Upload Dokka HTML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokka-html
          path: build/dokka/html
          retention-days: 14
          if-no-files-found: error
